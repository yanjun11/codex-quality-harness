[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-quality-harness"
version = "0.1.0"
description = "Local Codex controller, evidence gates and audited workflow adapters"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qh = "codex_quality_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
